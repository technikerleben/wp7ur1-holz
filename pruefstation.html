<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prüflabor · WP Technik 7</title><link rel="stylesheet" href="cockpit.css"><link rel="stylesheet" href="app-rueckweg.css"><script defer src="app-rueckweg.js"></script></head><body><main style="max-width:850px;margin:auto"><p class="eyebrow">A5 · PRÜFLABOR</p><h1 id="title">Deine Prüfstation</h1><nav id="stations" class="chips" aria-label="Station auswählen"></nav><section class="card"><p class="eyebrow">🔬 ERKUNDEN · 📁 A5.1 BEREITLEGEN</p><div id="instruction"></div><div class="tools"><button id="back">← Zurück</button><button id="next" class="primary">Erledigt → weiter</button></div></section><details class="card"><summary>💡 Wortspeicher</summary><p id="words"></p></details></main><script>
const STATIONS={aussehen:{title:'Aussehen und Maserung',steps:['Lege deine drei Proben auf eine helle Unterlage. Die Proben bleiben trocken.','Betrachte Farbe und Maserung. Nutze bei Bedarf eine Lupe.','Beschreibe jede Probe mit passenden Wörtern auf A5.1.'],words:'hell · dunkel · rötlich · feine Maserung · deutliche Maserung'},gewicht:{title:'Masse vergleichen',steps:['Prüfe: Sind die drei Proben gleich groß und ähnlich trocken? Sonst ist der Vergleich nicht aussagekräftig.','Stelle die Waage auf eine ebene Fläche. Prüfe, dass sie 0 g anzeigt.','Lege die erste Probe auf. Warte, bis der Wert ruhig steht. Notiere die Masse in g auf A5.1. Wiederhole das mit den anderen Proben.'],words:'Masse in Gramm (g) · leichter · schwerer · gleiche Größe'},haerte:{title:'Härte prüfen',steps:['Frage deine Lehrkraft, welche Prüfmethode ihr nutzt. Verwende für alle Proben dieselbe Münze oder denselben Fingernagel. Nutze keine Messer.','Lege die Probe flach auf eine rutschfeste Unterlage. Halte deine Finger aus dem Prüfbereich. Drücke oder ritze vorsichtig mit möglichst gleicher Kraft auf einer vergleichbaren Fläche.','Vergleiche die Spuren und notiere sie auf A5.1. Eine tiefere Spur spricht in diesem Vergleich für weicheres Holz.'],words:'keine Spur · leichte Spur · deutliche Spur · eher weich · eher hart'},wasser:{title:'Wasseraufnahme beobachten',steps:['Lege trockene Proben auf eine wasserfeste Unterlage. Vergleiche gleich vorbereitete Flächen mit gleicher Faserrichtung.','Gib mit der Pipette auf jede Probe einen gleich großen Tropfen. Starte die Zeitmessung.','Beobachte nach 60 Sekunden: Steht der Tropfen noch oder ist er eingezogen? Trage 60 s und deine Beobachtungen in A5.1 ein. Trockne danach die Unterlage.'],words:'Tropfen steht · teilweise eingezogen · eingezogen · Oberfläche'}};
const params=new URLSearchParams(location.search);let station=Object.hasOwn(STATIONS,params.get('station'))?params.get('station'):'aussehen',i=0;
function render(){const s=STATIONS[station];document.getElementById('title').textContent=s.title;document.getElementById('words').textContent=s.words;document.getElementById('instruction').innerHTML='<p class="muted">Schritt '+(i+1)+' von '+s.steps.length+'</p><p style="font-size:22px">'+s.steps[i]+'</p>';document.getElementById('back').hidden=i===0;document.getElementById('next').textContent=i===s.steps.length-1?'Station erledigt · zum Lernweg':'Erledigt → weiter';document.getElementById('stations').innerHTML=Object.entries(STATIONS).map(([id,x])=>'<a href="?station='+id+(params.get('von')==='A5'?'&von=A5':'')+'" '+(id===station?'aria-current="page"':'')+'>'+x.title+'</a>').join('');}
document.getElementById('back').onclick=()=>{i=Math.max(0,i-1);render();};document.getElementById('next').onclick=()=>{if(i<STATIONS[station].steps.length-1){i++;render();}else location.href='lernweg.html?auftrag=A5';};render();
</script></body></html>
