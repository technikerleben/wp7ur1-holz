<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dachlatten-Planer – HBG</title>
<style>:root {
  --col-slate-dark: #2C3D4C; --col-slate: #3E5668; --col-slate-mid: #6A8599; --col-slate-pale: #D0DCE6; --col-slate-ghost: #EEF3F7;
  --col-rust-dark: #9E4E22; --col-rust: #D97A4A; --col-rust-mid: #EBA882; --col-rust-pale: #F5DDD1; --col-rust-ghost: #FBF0EB;
  --col-sage-dark: #4D8B3F; --col-sage: #7DBB6F; --col-sage-mid: #A8D49D; --col-sage-pale: #DDF0D8; --col-sage-ghost: #F0FAF0;
  --col-warning: #C17B00; --col-warning-pale: #FFF3CC; --col-warning-text: #5C4400;
  --col-error: #C0392B; --col-error-pale: #FDECEA; --col-error-text: #7A1B14;
  --col-bg: #F5F4F1; --col-white: #FFFFFF; --col-text: #1E2A35; --col-text-muted: #5A6A78; --col-border: #D4D0C8;
  --col-disabled-bg: #EBEBEA; --col-disabled-text: #7A7672; --col-focus: #3E5668; --col-shadow: rgba(62,86,104,0.10);
  --text-xs: 0.694rem; --text-sm: 0.833rem; --text-base: 1rem; --text-md: 1.2rem; --text-lg: 1.44rem; --text-xl: 1.728rem;
  --panel-w: 400px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: var(--col-bg); color: var(--col-text);
  font-size: var(--text-base); line-height: 1.45;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
:focus-visible { outline: 3px solid var(--col-focus); outline-offset: 2px; border-radius: 4px; }
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }

#app { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; }

/* ---------- Header ---------- */
header {
  background: var(--col-slate); color: #fff;
  display: flex; align-items: center; gap: 16px;
  padding: 8px 16px; padding-top: max(8px, env(safe-area-inset-top));
}
.brand h1 { font-size: var(--text-md); font-weight: 700; line-height: 1.15; white-space: nowrap; }
.brand .meta { font-size: var(--text-xs); color: var(--col-slate-pale); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.wordmark { display: inline-flex; align-items: flex-end; gap: 4px; }
.wordmark b { font-size: var(--text-md); font-weight: 800; }
.wordmark span { font-size: var(--text-sm); color: var(--col-rust-mid); margin-bottom: 1px; }
#stepper { flex: 1; display: flex; justify-content: center; gap: 4px; list-style: none; }
#stepper button {
  position: relative; display: flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 4px 10px 4px 6px; border-radius: 999px;
  background: transparent; border: 2px solid transparent; color: var(--col-slate-pale);
  font-weight: 600; font-size: var(--text-sm);
}
#stepper .num {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--col-slate-dark); color: #fff; font-size: var(--text-sm); font-weight: 700;
}
#stepper button[aria-current="step"] { background: #fff; color: var(--col-slate-dark); }
#stepper button[aria-current="step"] .num { background: var(--col-rust-dark); }
#stepper .badge-n {
  position: absolute; top: -5px; right: -8px; min-width: 20px; height: 20px; padding: 0 5px;
  border-radius: 10px; background: var(--col-error); color: #fff; font-size: var(--text-xs);
  font-weight: 700; display: grid; place-items: center; border: 2px solid var(--col-slate);
}
#stepper .badge-ok { background: var(--col-sage-dark); }

/* ---------- Layout ---------- */
main { display: grid; grid-template-columns: var(--panel-w) 1fr; min-height: 0; }
main.wide { --panel-w: 560px; }
#panel {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--col-white); border-right: 1px solid var(--col-border);
}
#panel-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 18px 20px; }
#panel-nav {
  display: flex; gap: 10px; padding: 10px 18px; padding-bottom: max(10px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--col-border); background: var(--col-white);
}
#panel-nav button { flex: 1; }
.kicker { font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--col-rust-dark); }
h2 { font-size: var(--text-lg); line-height: 1.2; margin: 2px 0 6px; }
h3 { font-size: var(--text-base); margin: 16px 0 6px; }
p.lead { color: var(--col-text-muted); margin-bottom: 12px; }
.muted { color: var(--col-text-muted); font-size: var(--text-sm); }

/* ---------- Buttons ---------- */
.btn {
  min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 8px;
  font-weight: 600; border: 2px solid var(--col-slate); background: transparent; color: var(--col-slate);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: left;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--col-rust-dark); border-color: var(--col-rust-dark); color: #fff; }
.btn.success { background: var(--col-sage-dark); border-color: var(--col-sage-dark); color: #fff; }
.btn.small { min-height: 44px; padding: 6px 12px; font-size: var(--text-sm); }
.btn.block { display: flex; width: 100%; justify-content: flex-start; }
.btn:disabled { background: var(--col-disabled-bg); border-color: var(--col-disabled-bg); color: var(--col-disabled-text); cursor: not-allowed; }
.seg { display: inline-flex; border: 2px solid var(--col-slate); border-radius: 8px; overflow: hidden; background: var(--col-white); }
.seg button {
  min-height: 40px; min-width: 44px; padding: 4px 12px; border: 0; background: transparent;
  color: var(--col-slate); font-weight: 600; font-size: var(--text-sm);
}
.seg button + button { border-left: 2px solid var(--col-slate); }
.seg button[aria-pressed="true"] { background: var(--col-slate); color: #fff; }
.seg.full { display: flex; width: 100%; }
.seg.full button { flex: 1; }

/* ---------- Inputs ---------- */
input[type="number"], input[type="text"] {
  font-size: 1rem; font-family: inherit; padding: 8px 10px; min-height: 44px;
  border: 2px solid var(--col-border); border-radius: 8px; width: 100%;
  background: var(--col-white); color: var(--col-text);
}
input:focus-visible { outline: none; border-color: var(--col-slate); box-shadow: 0 0 0 3px var(--col-slate-pale); }
input[type="number"] { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; -moz-appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
.field { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; margin-bottom: 10px; }
.field label { font-weight: 600; }
.field .axis { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 800; }
.stepper-in { display: grid; grid-template-columns: 44px 92px 44px auto; align-items: center; gap: 6px; }
.stepper-in button { width: 44px; height: 44px; border-radius: 8px; border: 2px solid var(--col-slate); background: var(--col-white); color: var(--col-slate); font-size: 1.3rem; font-weight: 700; }
.unit { color: var(--col-text-muted); font-size: var(--text-sm); }
.field2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
.field2 label, .stack label { display: block; font-weight: 600; font-size: var(--text-sm); margin-bottom: 4px; }
.stack { margin-bottom: 10px; }

/* ---------- Karten / Feedback ---------- */
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.presets button {
  min-height: 60px; border-radius: 10px; border: 2px solid var(--col-border); background: var(--col-white);
  font-weight: 700; font-size: var(--text-md); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2;
}
.presets button small { font-size: var(--text-xs); font-weight: 600; color: var(--col-text-muted); }
.presets button[aria-pressed="true"] { border-color: var(--col-rust-dark); background: var(--col-rust-ghost); }
.figure { background: var(--col-slate-ghost); border-radius: 10px; padding: 10px; margin: 12px 0; text-align: center; }
.figure svg { max-width: 100%; height: auto; }
.fb { border-left: 4px solid; border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 10px 0; font-size: var(--text-sm); }
.fb.ok { background: var(--col-sage-pale); border-color: var(--col-sage-dark); color: #2D5C25; }
.fb.err { background: var(--col-error-pale); border-color: var(--col-error); color: var(--col-error-text); }
.fb.tip { background: var(--col-slate-pale); border-color: var(--col-slate-mid); color: var(--col-text); }
.fb.warn { background: var(--col-warning-pale); border-color: var(--col-warning); color: var(--col-warning-text); }
.fb b { font-weight: 700; }

.wcard { border: 2px solid var(--col-border); border-radius: 10px; padding: 4px 12px 8px; margin-bottom: 8px; background: var(--col-white); }
.wcard.sel { border-color: var(--col-slate); box-shadow: 0 0 0 3px var(--col-slate-pale); }
.wcard.off { background: var(--col-bg); }
.wcard.bad { border-left: 6px solid var(--col-error); }
.wcard.good { border-left: 6px solid var(--col-sage-dark); }
.wcard-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.wcard-head .name { font-weight: 700; flex: 1; background: none; border: 0; text-align: left; min-height: 44px; }
.wrow { display: flex; align-items: center; gap: 8px; }
.wrow .info { flex: 1; margin: 0 0 4px; }
.wcard .row { margin-top: 6px; }
.wcard .info { font-size: var(--text-sm); color: var(--col-text-muted); margin: 2px 0 8px; }
.wcard .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.status { font-weight: 700; white-space: nowrap; }
.status.ok { color: #2D5C25; } .status.bad { color: var(--col-error-text); }
.calc { font-variant-numeric: tabular-nums; background: var(--col-slate-ghost); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: var(--text-sm); }
.calc .big { font-size: var(--text-base); font-weight: 700; }
.sugg { display: grid; gap: 6px; margin-top: 8px; }
.sugg .btn { flex-direction: column; align-items: flex-start; gap: 0; line-height: 1.3; }
.sugg .btn small { font-weight: 500; color: var(--col-text-muted); }
.sugg .btn.all small { color: #2D5C25; }

.switch { position: relative; width: 56px; height: 44px; border: 0; background: none; flex: none; }
.switch::before { content: ''; position: absolute; left: 2px; right: 2px; top: 8px; height: 28px; border-radius: 14px; background: var(--col-disabled-text); transition: background .15s; }
.switch::after { content: ''; position: absolute; left: 5px; top: 11px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"]::before { background: var(--col-sage-dark); }
.switch[aria-checked="true"]::after { transform: translateX(24px); }

.edge-row { padding: 8px 0; border-bottom: 1px solid var(--col-border); }
.edge-row.sel { background: var(--col-rust-ghost); margin: 0 -10px; padding: 8px 10px; border-radius: 8px; border-bottom-color: transparent; }
.edge-row .lbl { font-size: var(--text-sm); color: var(--col-text-muted); margin-bottom: 4px; }

table.list { width: 100%; border-collapse: collapse; font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
table.list th { text-align: left; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .05em; color: var(--col-text-muted); padding: 6px 8px; border-bottom: 2px solid var(--col-slate); }
table.list td { padding: 8px; border-bottom: 1px solid var(--col-border); vertical-align: top; }
table.list td.num, table.list th.num { text-align: right; white-space: nowrap; }
table.list tr.bad td { color: var(--col-error-text); background: var(--col-error-pale); }
.total { display: flex; align-items: baseline; gap: 10px; background: var(--col-sage-pale); border-radius: 10px; padding: 12px 14px; margin: 10px 0; color: #2D5C25; }
.total .n { font-size: var(--text-xl); font-weight: 800; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--col-slate-ghost); border: 1px solid var(--col-slate-pale); border-radius: 8px; padding: 6px 10px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: var(--text-sm); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }

/* ---------- 3D-Ansicht ---------- */
#view { position: relative; min-width: 0; min-height: 0; overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, #ffffff 0%, var(--col-slate-ghost) 60%, var(--col-slate-pale) 130%); }
#view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#gl { touch-action: none; }
#ov { pointer-events: none; }
.vctl { position: absolute; display: flex; gap: 8px; align-items: center; }
.vctl.tl { top: 12px; left: 12px; } .vctl.tr { top: 12px; right: 12px; }
.vctl.bl { bottom: 12px; left: 12px; padding-bottom: env(safe-area-inset-bottom); }
.vctl .cap { font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--col-slate); }
.slider-box { background: rgba(255,255,255,.92); border: 2px solid var(--col-slate); border-radius: 10px; padding: 4px 12px; display: flex; align-items: center; gap: 10px; min-height: 44px; }
input[type="range"] { width: 180px; height: 36px; accent-color: var(--col-rust-dark); }
#hint3d { position: absolute; right: 14px; bottom: 14px; font-size: var(--text-xs); color: var(--col-text-muted); pointer-events: none; }
#edge-pop {
  position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%);
  background: #fff; border: 2px solid var(--col-rust-dark); border-radius: 12px; padding: 10px 12px;
  box-shadow: 0 6px 20px var(--col-shadow); text-align: center; max-width: 92%;
}
#edge-pop .q { font-weight: 700; margin-bottom: 6px; font-size: var(--text-sm); }
#no3d { position: absolute; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center; color: var(--col-text-muted); }
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--col-slate-dark); color: #fff; padding: 10px 18px; border-radius: 10px;
  font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 20; max-width: 90vw;
}
[hidden] { display: none !important; }

@media (max-width: 1100px) {
  .brand .meta { display: none; }
  #stepper button { padding-right: 8px; font-size: var(--text-xs); }
  :root { --panel-w: 372px; }
  main.wide { --panel-w: 500px; }
  input[type="range"] { width: 130px; }
}
@media (orientation: portrait) {
  main, main.wide { grid-template-columns: 1fr; grid-template-rows: 42% 58%; }
  #view { order: -1; }
  #panel { border-right: 0; border-top: 1px solid var(--col-border); }
  #stepper .lbl { display: none; }
}

/* ---------- Möbelwahl, Baukasten ---------- */
.types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.types button {
  display: flex; align-items: center; gap: 10px; text-align: left; min-height: 72px; padding: 8px 10px;
  border-radius: 10px; border: 2px solid var(--col-border); background: var(--col-white); color: var(--col-slate);
}
.types button b { display: block; color: var(--col-text); line-height: 1.2; }
.types button small { display: block; font-size: var(--text-xs); color: var(--col-text-muted); line-height: 1.25; margin-top: 2px; }
.types button svg { flex: none; }
.types button[aria-pressed="true"] { border-color: var(--col-rust-dark); background: var(--col-rust-ghost); color: var(--col-rust-dark); }
.nrow { margin: 8px 0; }
.nrow > label { display: block; font-weight: 600; font-size: var(--text-sm); margin-bottom: 4px; }
.nrow .note, .wcard .note { margin-top: 4px; }
.wcard-head span.name { font-weight: 700; flex: 1; }
.wcard h3 { margin-top: 12px; }
details.fine { margin: 10px 0; border: 1px solid var(--col-border); border-radius: 8px; padding: 0 10px; }
details.fine summary { min-height: 44px; display: flex; align-items: center; font-weight: 600; font-size: var(--text-sm); color: var(--col-slate); cursor: pointer; }
.plist { display: grid; gap: 6px; }
.plist button {
  display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 44px; padding: 6px 12px;
  border: 2px solid var(--col-border); border-radius: 8px; background: var(--col-white); font-size: var(--text-sm); text-align: left;
}
.plist button span { color: var(--col-text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.plist button[aria-pressed="true"] { border-color: var(--col-slate); background: var(--col-slate-ghost); }
.plist button.bad { border-left: 6px solid var(--col-error); }
#stepper { gap: 2px; }
@media (max-width: 1250px) {
  #stepper button:not([aria-current="step"]) .lbl { display: none; }
  #stepper button:not([aria-current="step"]) { padding: 4px 6px; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>Dachlatten-Planer</h1>
      <div class="meta">HBG Dortmund · WP Technik · Klasse 7</div>
    </div>
    <ol id="stepper" aria-label="Schritte"></ol>
    <div class="wordmark" aria-hidden="true"><b>HBG</b><span>SRL</span></div>
  </header>
  <main id="main">
    <section id="panel" aria-label="Planung">
      <div id="panel-body"></div>
      <div id="panel-nav">
        <button class="btn" id="btn-prev" data-act="prev">← Zurück</button>
        <button class="btn primary" id="btn-next" data-act="next">Weiter →</button>
      </div>
    </section>
    <section id="view" aria-label="3D-Ansicht">
      <canvas id="gl"></canvas>
      <canvas id="ov"></canvas>
      <div id="no3d" hidden>Die 3D-Ansicht geht auf diesem Gerät leider nicht. Du kannst trotzdem planen: Die Maße und Listen stimmen.</div>
      <div class="vctl tl">
        <div class="seg" id="seg-view" role="group" aria-label="Ansicht">
          <button data-act="view" data-view="iso">3D</button>
          <button data-act="view" data-view="front">Vorne</button>
          <button data-act="view" data-view="side">Seite</button>
          <button data-act="view" data-view="top">Oben</button>
        </div>
      </div>
      <div class="vctl tr">
        <span class="cap">Maße</span>
        <div class="seg" id="seg-dim" role="group" aria-label="Maße anzeigen">
          <button data-act="dim" data-mode="aussen">Außen</button>
          <button data-act="dim" data-mode="innen">Innen</button>
          <button data-act="dim" data-mode="aus">Aus</button>
        </div>
      </div>
      <div class="vctl bl">
        <label class="slider-box" id="explode-box"><span class="cap">Auseinander ziehen</span>
          <input type="range" id="explode" min="0" max="100" value="0" aria-label="Wände auseinander ziehen">
        </label>
      </div>
      <div id="edge-pop" hidden></div>
      <div id="hint3d">1 Finger: drehen · 2 Finger: zoomen</div>
    </section>
  </main>
</div>
