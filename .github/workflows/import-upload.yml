name: Import uploaded lesson files

on:
  push:
    paths:
      - 'upload.ready'

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message != 'Assemble uploaded lesson files'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild ZIP and extract files
        shell: bash
        run: |
          set -euo pipefail
          cat .upload-parts/part-*.b64 > /tmp/files.zip.b64
          base64 --decode /tmp/files.zip.b64 > /tmp/files.zip
          unzip -o /tmp/files.zip -d .
          rm -rf .upload-parts upload.ready .github/workflows/import-upload.yml

      - name: Commit imported files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble uploaded lesson files"
          git push
