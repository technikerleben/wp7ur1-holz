<style>
:root{

--col-rust-dark:#9E4E22;--col-rust:#D97A4A;--col-rust-mid:#EBA882;--col-rust-pale:#F5DDD1;--col-rust-ghost:#FBF0EB;
--col-sage-dark:#4D8B3F;--col-sage:#7DBB6F;--col-sage-pale:#DDF0D8;--col-sage-ghost:#F0FAF0;
--col-warning:#C17B00;--col-warning-pale:#FFF3CC;--col-warning-text:#5C4400;
--col-error:#C0392B;--col-error-pale:#FDECEA;--col-error-text:#7A1B14;
--col-bg:#F5F4F1;--col-white:#FFFFFF;--col-text:#1E2A35;--col-text-muted:#5A6A78;
--col-border:#D4D0C8;--col-disabled-bg:#EBEBEA;--col-disabled-text:#7A7672;
--col-focus:#3E5668;--col-shadow:rgba(62,86,104,0.10);
--text-xs:0.694rem;--text-sm:0.833rem;--text-base:1rem;--text-md:1.2rem;--text-lg:1.44rem;--text-xl:1.728rem;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--col-bg);color:var(--col-text);
font-size:var(--text-base);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;-webkit-text-size-adjust:100%;}
:focus-visible{outline:3px solid var(--col-focus);outline-offset:3px;border-radius:4px;}
header{background:var(--col-slate);color:#fff;padding:12px 0;position:sticky;top:0;z-index:10;}
header h1{font-size:var(--text-lg);font-weight:700;line-height:1.2;}
.header-meta{font-size:var(--text-xs);color:var(--col-slate-pale);text-transform:uppercase;letter-spacing:.06em;}
.hbg-wordmark{display:inline-flex;align-items:flex-end;gap:5px;}
.hbg-wordmark__main{font-size:var(--text-lg);font-weight:800;color:#fff;}
.hbg-wordmark__sub{font-size:var(--text-sm);color:var(--col-rust-mid);margin-bottom:2px;}
.container{max-width:960px;margin:0 auto;padding:14px 22px;width:100%;}
main{flex:1;padding-bottom:40px;}
.card{background:var(--col-white);border-radius:12px;padding:18px 22px;margin-bottom:16px;box-shadow:0 2px 8px var(--col-shadow);}
.auftrag{background:var(--col-white);border-radius:12px;padding:18px 22px;margin-bottom:16px;box-shadow:0 2px 8px var(--col-shadow);border-left:5px solid var(--col-rust);}
.auftrag.fertig{border-left-color:var(--col-sage-dark);background:var(--col-sage-ghost);}
.input-card{background:var(--col-white);border-radius:12px;padding:18px 22px;margin-bottom:16px;box-shadow:0 2px 8px var(--col-shadow);border-left:5px solid var(--col-slate);}
.halt{background:var(--col-slate-ghost);border:2px dashed var(--col-slate-mid);border-radius:12px;padding:16px 20px;margin-bottom:16px;}
h2{font-size:var(--text-lg);margin-bottom:6px;}
h3{font-size:var(--text-md);margin:0 0 4px;}
h4{font-size:var(--text-base);margin:12px 0 4px;}
p{margin-bottom:8px;}
ol,ul{margin:0 0 8px 20px;}
li{margin-bottom:3px;}
.muted{color:var(--col-text-muted);font-size:var(--text-sm);}
.btn-primary{background:var(--col-rust-dark);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:var(--text-base);font-weight:600;min-height:44px;min-width:44px;cursor:pointer;font-family:inherit;transition:background .2s;}
.btn-primary:hover{background:#B55E2A;}
.btn-success{background:var(--col-sage-dark);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:600;min-height:44px;cursor:pointer;font-family:inherit;font-size:var(--text-base);}
.btn-success:hover{background:#3D7032;}
.btn-secondary{background:transparent;color:var(--col-slate);border:2px solid var(--col-slate);padding:9px 16px;border-radius:8px;font-weight:600;min-height:44px;cursor:pointer;font-family:inherit;font-size:var(--text-sm);transition:background .2s;}
.btn-secondary:hover{background:var(--col-slate-ghost);}
.btn-secondary[aria-pressed="true"]{background:var(--col-slate);color:#fff;}
.btn-secondary:disabled{color:var(--col-disabled-text);border-color:var(--col-disabled-bg);cursor:not-allowed;}
.wochen-nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.wochen-nav button{white-space:nowrap;flex:0 0 auto;}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.07em;line-height:1.4;}
.badge--slate{background:var(--col-slate);color:#fff;}
.badge--rust{background:var(--col-rust-dark);color:#fff;}
.badge--success{background:var(--col-sage-dark);color:#fff;}
.badge--warning{background:var(--col-warning);color:#fff;}
.badge--pale-slate{background:var(--col-slate-pale);color:var(--col-slate);}
.kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.progress-bar{height:8px;background:var(--col-slate-pale);border-radius:4px;overflow:hidden;margin:6px 0;}
.progress-bar__fill{height:100%;background:var(--col-rust);border-radius:4px;transition:width .4s ease;}
.progress-bar__fill--done{background:var(--col-sage);}
.progress-label{display:flex;justify-content:space-between;font-size:var(--text-xs);color:var(--col-text-muted);}
.tipp-details{background:var(--col-slate-pale);border-left:4px solid var(--col-slate-mid);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;}
.tipp-details summary{cursor:pointer;font-weight:600;font-size:var(--text-sm);color:var(--col-slate);list-style:none;user-select:none;}
.tipp-details summary::-webkit-details-marker{display:none;}
.tipp-details p{margin-top:8px;font-size:var(--text-sm);margin-bottom:0;}
.feedback-richtig{background:var(--col-sage-pale);border-left:4px solid var(--col-sage-dark);border-radius:0 8px 8px 0;padding:12px 16px;color:#2D5C25;margin-top:10px;}
.feedback-richtig::before{content:'✓ ';font-weight:700;color:var(--col-sage-dark);}
.feedback-tipp{background:var(--col-slate-pale);border-left:4px solid var(--col-slate-mid);border-radius:0 8px 8px 0;padding:12px 16px;margin-top:10px;}
.feedback-tipp::before{content:'ℹ ';font-weight:700;color:var(--col-slate);}
.feedback-warnung{background:var(--col-warning-pale);border-left:4px solid var(--col-warning);border-radius:0 8px 8px 0;padding:12px 16px;color:var(--col-warning-text);margin-top:10px;}
.feedback-warnung::before{content:'⚠ ';font-weight:700;}
input[type=text],input[type=number],textarea{font-size:var(--text-base);font-family:inherit;padding:10px 14px;border:2px solid var(--col-border);border-radius:8px;width:100%;background:#fff;color:var(--col-text);}
input:focus-visible,textarea:focus-visible{outline:none;border-color:var(--col-slate);box-shadow:0 0 0 3px var(--col-slate-pale);}
textarea{resize:vertical;min-height:72px;}
label{display:block;font-weight:600;font-size:var(--text-sm);margin-bottom:4px;}
.check{display:flex;align-items:flex-start;gap:10px;padding:8px 0;cursor:pointer;font-size:var(--text-sm);}
.check input{width:26px;height:26px;flex:0 0 auto;accent-color:var(--col-sage-dark);margin-top:1px;}
.zeit{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--col-slate-ghost);border-radius:10px;padding:10px 14px;margin:10px 0;}
.zeit label{margin:0;}
.zeit input{max-width:96px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;}
.applink{display:inline-flex;align-items:center;gap:8px;background:var(--col-rust-pale);color:var(--col-rust-dark);border:2px solid var(--col-rust-dark);
border-radius:8px;padding:10px 16px;font-weight:700;text-decoration:none;min-height:44px;font-size:var(--text-sm);}
.applink:hover{background:var(--col-rust-ghost);}
.beruf{background:var(--col-warning-pale);border-left:5px solid var(--col-warning);border-radius:0 12px 12px 0;padding:14px 18px;margin-bottom:16px;}
.beruf h3{color:var(--col-warning-text);}
.uebersicht td,.uebersicht th{border-bottom:1px solid var(--col-border);padding:8px 6px;text-align:left;font-size:var(--text-sm);}
.uebersicht{width:100%;border-collapse:collapse;}
.punkt{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--col-slate-pale);margin-right:4px;}
.punkt.an{background:var(--col-sage);}
[hidden]{display:none !important;}
@media print{
  header,.wochen-nav,.no-print{display:none !important;}
  .woche{display:block !important;page-break-after:always;}
  .card,.auftrag,.input-card{box-shadow:none;border:1px solid #999;}
  body{background:#fff;}
}
</style>
</head>
<body>
<header>
  <div class="container" style="display:flex;justify-content:space-between;align-items:center;padding-top:0;padding-bottom:0;">
    <div>
      <h1>Vom Baum zum Möbelstück</h1>
      <div class="header-meta">HBG Dortmund · WP Technik · Klasse 7</div>
    </div>
    <div class="hbg-wordmark"><span class="hbg-wordmark__main">HBG</span><span class="hbg-wordmark__sub">SRL</span></div>
  </div>
</header>

<main><div class="container">

  <div class="card no-print">
    <div class="kopf">
      <div>
        <h2 style="margin:0;">Mein Lernweg</h2>
        <p class="muted" style="margin:0;">Du arbeitest in deinem Tempo. Montags gibt es einen kurzen Input, danach geht es weiter.</p>
      </div>
      <span class="badge badge--pale-slate" id="stand">0 von 10</span>
    </div>
    <div class="progress-label"><span>Erledigte Aufträge</span><span id="prozent">0 %</span></div>
    <div class="progress-bar"><div class="progress-bar__fill" id="gesamt-balken" style="width:0%"></div></div>
    <div id="punkte" style="margin-top:6px;"></div>
  </div>

  <nav class="wochen-nav no-print" id="wochen-nav" aria-label="Wochen"></nav>

  <div id="wochen"></div>

  <div class="card no-print" style="text-align:center;">
    <button class="btn-secondary" onclick="window.print()">🖨 Lernweg ausdrucken</button>
    <button class="btn-secondary" onclick="allesZuruecksetzen()">Alles zurücksetzen</button>
  </div>

</div></main>

 nr:6,titel:'Check und Lernnachweis',
 input:{titel:'Montag: Kompetenzcheck',text:'Du prüfst selbst, was du schon sicher kannst. Danach übst du gezielt das, was noch fehlt. Der Check zählt nicht für die Note.'},
 beruf:{titel:'Rückblick: vier Berufe',text:'Forstwirt/in, Holzbearbeitungsmechaniker/in, Holztechniker/in, Tischler/in. Welcher Beruf würde dich am ehesten interessieren? Warum?'},
 auftraege:[
  {id:'C',titel:'Mein Kompetenzcheck',zeit:25,app:{href:'kompetenzcheck.html',text:'Kompetenzcheck öffnen'},
   ziel:'Ich weiß, was ich schon kann und was ich noch üben muss.',
   schritte:['Gehe die sieben Ich-kann-Sätze durch.','Kreuze ehrlich an.','Wähle danach deine Übung aus der Tabelle.'],
   hilfen:[{t:'Hilfe: Welche Übung?',x:'Noch unsicher → Grundlagen mit Bildhilfen. Teilweise sicher → ähnliche Aufgabe. Sicher → Transferaufgabe mit unbekannter Holzprobe.'}],
   check:['Ich habe alle sieben Sätze eingeschätzt.','Ich habe meine Übung ausgewählt.'],
   selbstcheck:['Ich kann den Weg vom Baum zum Brett ordnen.','Ich kann die Teile des Stammes benennen.','Ich kann Beobachtung und Eigenschaft unterscheiden.','Ich kann erklären, warum Holz getrocknet wird.','Ich kann Quellen und Schwinden erklären.','Ich kann eine Holzart passend auswählen.','Ich kann meine Materialentscheidung begründen.']}
 ],
 halt:'Mittwoch: Lernnachweis (60 Minuten), danach Abschlussreflexion.'
}
];

/* ================= Speicher ================= */
const KEY='hbg_lernweg_holz7';
let daten=lade();
function lade(){try{return JSON.parse(localStorage.getItem(KEY))||{fertig:{},felder:{},checks:{}};}catch(e){return {fertig:{},felder:{},checks:{}};}}
function sichere(){try{localStorage.setItem(KEY,JSON.stringify(daten));}catch(e){}}

/* ================= Aufbau ================= */
let aktiveWoche=1;
const ALLE=WOCHEN.flatMap(w=>w.auftraege.filter(a=>a.id.startsWith('A')).map(a=>a.id));

function baueNav(){
  document.getElementById('wochen-nav').innerHTML=WOCHEN.map(w=>{
    const n=w.auftraege.filter(a=>daten.fertig[a.id]).length;
    const ok=n===w.auftraege.length?' ✓':'';
    return `<button class="btn-secondary" aria-pressed="${w.nr===aktiveWoche}" onclick="zeigeWoche(${w.nr})">Woche ${w.nr}${ok}</button>`;
  }).join('');
}

function auftragHTML(a){
  const fertig=!!daten.fertig[a.id];
  return `
  <article class="auftrag ${fertig?'fertig':''}" id="auftrag-${a.id}">
    <div class="kopf">
      <h3>${a.id} · ${a.titel}</h3>
      <div style="display:flex;gap:6px;">
        ${a.plus?'<span class="badge badge--warning">🔼 Schritt</span>':''}
        ${a.stern?'<span class="badge badge--success">⭐ Entdecker</span>':''}
        ${fertig?'<span class="badge badge--success">fertig</span>':''}
      </div>
    </div>
    <p><strong>🎯 Mein Ziel:</strong> ${a.ziel}</p>
    <h4>📋 Mein Auftrag</h4>
    <ol>${a.schritte.map(s=>`<li>${s}</li>`).join('')}</ol>
    ${a.selbstcheck?`<h4>Meine Einschätzung</h4>${a.selbstcheck.map((s,i)=>checkHTML(a.id+'_sc'+i,s)).join('')}`:''}
    ${a.app?`<p><a class="applink" href="${a.app.href}" target="_blank" rel="noopener">▶ ${a.app.text}</a></p>`:''}
    <div class="zeit">
      <label for="z-${a.id}">⏱ So viel Zeit plane ich:</label>
      <input type="number" id="z-${a.id}" min="5" max="120" step="5" inputmode="numeric" placeholder="${a.zeit}"
        value="${daten.felder['z-'+a.id]||''}" onchange="feldSpeichern('z-${a.id}',this.value)">
      <span class="muted">Minuten · Vorschlag: ${a.zeit} Min</span>
    </div>
    <h4>💡 Hilfe öffnen</h4>
    ${a.hilfen.map(h=>`<details class="tipp-details"><summary>${h.t}</summary><p>${h.x}</p></details>`).join('')}
    ${a.plus?`<div class="feedback-warnung"><strong>🔼 Noch einen Schritt:</strong> ${a.plus}</div>`:''}
    ${a.stern?`<div class="feedback-richtig"><strong>⭐ Für Entdecker:</strong> ${a.stern}</div>`:''}
    <h4>✅ Ergebnis kontrollieren</h4>
    ${a.check.map((c,i)=>checkHTML(a.id+'_c'+i,c)).join('')}
    <div class="row no-print">
      <button class="${fertig?'btn-secondary':'btn-success'}" onclick="abschliessen('${a.id}')">
        ${fertig?'Wieder öffnen':'Auftrag abschließen'}</button>
    </div>
  </article>`;
}

function checkHTML(id,text){
  const an=daten.checks[id]?'checked':'';
  return `<label class="check"><input type="checkbox" id="${id}" ${an} onchange="checkSpeichern('${id}',this.checked)"><span>${text}</span></label>`;
}

function wocheHTML(w){
  return `
  <section class="woche" id="woche-${w.nr}">
    <div class="input-card">
      <span class="badge badge--slate">Woche ${w.nr}</span>
      <h2 style="margin-top:8px;">${w.titel}</h2>
      <p><strong>${w.input.titel}</strong></p>
      <p class="muted">${w.input.text}</p>
    </div>
    <div class="beruf">
      <h3>${w.beruf.titel}</h3>
      <p style="margin:0;">${w.beruf.text}</p>
    </div>
    ${w.auftraege.map(auftragHTML).join('')}
    <div class="halt"><strong>🛑 ${w.halt}</strong></div>
  </section>`;
}

function zeigeWoche(nr){
  aktiveWoche=nr;
  document.querySelectorAll('.woche').forEach(s=>s.hidden=(s.id!=='woche-'+nr));
  baueNav();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ================= Aktionen ================= */
function abschliessen(id){
  const a=WOCHEN.flatMap(w=>w.auftraege).find(x=>x.id===id);
  const offen=a.check.some((c,i)=>!daten.checks[id+'_c'+i]);
  if(!daten.fertig[id] && offen){
    if(!confirm('Es ist noch nicht alles abgehakt. Trotzdem abschließen?'))return;
  }
  daten.fertig[id]=!daten.fertig[id];
  sichere();rendern();
  const el=document.getElementById('auftrag-'+id);
  if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
}
function checkSpeichern(id,wert){daten.checks[id]=wert;sichere();}
function feldSpeichern(id,wert){daten.felder[id]=wert;sichere();}
function allesZuruecksetzen(){
  if(!confirm('Wirklich alles zurücksetzen? Deine Häkchen und Zeitangaben gehen verloren.'))return;
  daten={fertig:{},felder:{},checks:{}};sichere();rendern();
}

function fortschritt(){
  const n=ALLE.filter(id=>daten.fertig[id]).length;
  document.getElementById('stand').textContent=n+' von '+ALLE.length;
  document.getElementById('prozent').textContent=Math.round(n/ALLE.length*100)+' %';
  const b=document.getElementById('gesamt-balken');
  b.style.width=(n/ALLE.length*100)+'%';
  b.classList.toggle('progress-bar__fill--done',n===ALLE.length);
  document.getElementById('punkte').innerHTML=
    ALLE.map(id=>`<span class="punkt ${daten.fertig[id]?'an':''}" title="${id}"></span>`).join('')+
    `<span class="muted" style="margin-left:8px;">A1 – A10</span>`;
}

function rendern(){
  document.getElementById('wochen').innerHTML=WOCHEN.map(wocheHTML).join('');
  document.querySelectorAll('.woche').forEach(s=>s.hidden=(s.id!=='woche-'+aktiveWoche));
  baueNav();fortschritt();
}
window.addEventListener('DOMContentLoaded',rendern);
</script>
</body>
</html>
